# The "DevOps team's pipeline" that almost every GitLab exercise starts from.
# Security jobs are bolted onto this — you are NOT expected to understand or
# change build/test; you only add jobs and stages around them.
image: docker:20.10             # default image for every job (has the docker CLI)

services:
  - docker:dind                 # docker daemon side-car so `docker run` works inside jobs

stages:
  - build
  - test
  - release
  - preprod
  - integration
  - prod

build:
  stage: build
  image: python:3.6
  before_script:
    - pip3 install --upgrade virtualenv
  script:
    - virtualenv env                    # create a virtualenv for the app
    - source env/bin/activate           # activate it
    - pip install -r requirements.txt   # install third-party packages
    - python manage.py check            # sanity check the Django app

test:
  stage: test
  image: python:3.6
  before_script:
    - pip3 install --upgrade virtualenv
  script:
    - virtualenv env
    - source env/bin/activate
    - pip install -r requirements.txt
    - python manage.py test taskManager

integration:
  stage: integration
  script:
    - echo "This is an integration step"
    - exit 1
  allow_failure: true           # even if the job fails, continue to the next stages

prod:
  stage: prod
  script:
    - echo "This is a deploy step."
  when: manual                  # Continuous Delivery (human clicks "play")

oast-snyk:
  stage: build
  image: node:alpine3.10
  before_script:
    - wget -O snyk https://github.com/snyk/cli/releases/download/v1.1156.0/snyk-alpine
    - chmod +x snyk
    - mv snyk /usr/local/bin/
  script:
    - npm install
    - snyk auth $SNYK_TOKEN          # CI/CD variable (protected) — never commit the token
    - snyk test --json > snyk-results.json
    - cat snyk-results.json
  artifacts:
    paths:
      - snyk-results.json
    when: always
    expire_in: one week
  allow_failure: true                # snyk exits 1 when vulnerabilities are found
