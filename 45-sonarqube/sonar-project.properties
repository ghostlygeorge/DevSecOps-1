# Put this at the repo root; then `sonar-scanner -Dsonar.host.url=... -Dsonar.login=$SONARQUBE_TOKEN`
sonar.projectKey=Django
sonar.projectName=Django
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/migrations/**,**/static/**/*.min.js
sonar.python.version=3.6
sonar.sourceEncoding=UTF-8
# make the scanner FAIL (exit 1) when the quality gate fails — essential for CI gating
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
