# The "DevOps team's pipeline" that almost every GitLab exercise starts from.
# Security jobs are bolted onto this — you are NOT expected to understand or
# change build/test; you only add jobs and stages around them.
image: docker:20.10             # default image for every job (has the docker CLI)

services:
  - docker:dind                 # docker daemon side-car so `docker run` works inside jobs

stages:
  - build
  - test
  - release
  - preprod
  - integration
  - prod

build:
  stage: build
  image: python:3.6
  before_script:
    - pip3 install --upgrade virtualenv
  script:
    - virtualenv env                    # create a virtualenv for the app
    - source env/bin/activate           # activate it
    - pip install -r requirements.txt   # install third-party packages
    - python manage.py check            # sanity check the Django app

test:
  stage: test
  image: python:3.6
  before_script:
    - pip3 install --upgrade virtualenv
  script:
    - virtualenv env
    - source env/bin/activate
    - pip install -r requirements.txt
    - python manage.py test taskManager

integration:
  stage: integration
  script:
    - echo "This is an integration step"
    - exit 1
  allow_failure: true           # even if the job fails, continue to the next stages

prod:
  stage: prod
  script:
    - echo "This is a deploy step."
  when: manual                  # Continuous Delivery (human clicks "play")

# Variables (Settings -> CI/CD -> Variables):
#   DOJO_HOST       = dojo-LABID.lab.practical-devsecops.training
#   DOJO_API_TOKEN  = token from https://dojo-LABID.lab.practical-devsecops.training/api/key-v2  (masked)
# upload-results.py must be committed to the repo root.
sast:
  stage: build
  before_script:
    - apk add py-pip py-requests            # the upload script needs python3 + requests in the docker:20.10 (alpine) image
  script:
    - docker pull hysnsec/bandit
    - docker run --user $(id -u):$(id -g) -v $(pwd):/src --rm hysnsec/bandit -r /src -f json -o /src/bandit-output.json
  after_script:                              # runs even though bandit exited 1
    - python3 upload-results.py --host $DOJO_HOST --api_key $DOJO_API_TOKEN --engagement_id 1 --product_id 1 --lead_id 1 --environment "Production" --result_file bandit-output.json --scanner "Bandit Scan"
  artifacts:
    paths: [bandit-output.json]
    when: always
  allow_failure: true

dast-zap:
  stage: integration
  before_script:
    - apk add py-pip py-requests
    - docker pull softwaresecurityproject/zap-stable:2.13.0
  script:
    - docker run --user $(id -u):$(id -g) -w /zap -v $(pwd):/zap/wrk:rw --rm softwaresecurityproject/zap-stable:2.13.0 zap-baseline.py -t https://prod-LABID.lab.practical-devsecops.training -d -x zap-output.xml
  after_script:
    - python3 upload-results.py --host $DOJO_HOST --api_key $DOJO_API_TOKEN --engagement_id 1 --product_id 1 --lead_id 1 --environment "Production" --result_file zap-output.xml --scanner "ZAP Scan"
  artifacts:
    paths: [zap-output.xml]
    when: always
    expire_in: 1 day
  allow_failure: true
