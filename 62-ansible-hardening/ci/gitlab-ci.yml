# The "DevOps team's pipeline" that almost every GitLab exercise starts from.
# Security jobs are bolted onto this — you are NOT expected to understand or
# change build/test; you only add jobs and stages around them.
image: docker:20.10             # default image for every job (has the docker CLI)

services:
  - docker:dind                 # docker daemon side-car so `docker run` works inside jobs

stages:
  - build
  - test
  - release
  - preprod
  - integration
  - prod

build:
  stage: build
  image: python:3.6
  before_script:
    - pip3 install --upgrade virtualenv
  script:
    - virtualenv env                    # create a virtualenv for the app
    - source env/bin/activate           # activate it
    - pip install -r requirements.txt   # install third-party packages
    - python manage.py check            # sanity check the Django app

test:
  stage: test
  image: python:3.6
  before_script:
    - pip3 install --upgrade virtualenv
  script:
    - virtualenv env
    - source env/bin/activate
    - pip install -r requirements.txt
    - python manage.py test taskManager

integration:
  stage: integration
  script:
    - echo "This is an integration step"
    - exit 1
  allow_failure: true           # even if the job fails, continue to the next stages

prod:
  stage: prod
  script:
    - echo "This is a deploy step."
  when: manual                  # Continuous Delivery (human clicks "play")

# Variables: DEPLOYMENT_SERVER = prod-LABID ; DEPLOYMENT_SERVER_SSH_PRIVKEY = prod's /root/.ssh/id_rsa
# Commit ansible-hardening.yml to the repo root, or this job fails with
#   "ERROR! the playbook: ansible-hardening.yml could not be found"
ansible-hardening:
  stage: prod
  image: willhallonline/ansible:2.9-ubuntu-18.04
  before_script:
    - mkdir -p ~/.ssh
    - echo "$DEPLOYMENT_SERVER_SSH_PRIVKEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -t rsa $DEPLOYMENT_SERVER >> ~/.ssh/known_hosts
  script:
    - echo -e "[prod]\n$DEPLOYMENT_SERVER" >> inventory.ini
    - ansible-galaxy install dev-sec.os-hardening
    - ansible-playbook -i inventory.ini ansible-hardening.yml
