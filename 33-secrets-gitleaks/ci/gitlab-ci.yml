# The "DevOps team's pipeline" that almost every GitLab exercise starts from.
# Security jobs are bolted onto this — you are NOT expected to understand or
# change build/test; you only add jobs and stages around them.
image: docker:20.10             # default image for every job (has the docker CLI)

services:
  - docker:dind                 # docker daemon side-car so `docker run` works inside jobs

stages:
  - build
  - test
  - release
  - preprod
  - integration
  - prod

build:
  stage: build
  image: python:3.6
  before_script:
    - pip3 install --upgrade virtualenv
  script:
    - virtualenv env                    # create a virtualenv for the app
    - source env/bin/activate           # activate it
    - pip install -r requirements.txt   # install third-party packages
    - python manage.py check            # sanity check the Django app

test:
  stage: test
  image: python:3.6
  before_script:
    - pip3 install --upgrade virtualenv
  script:
    - virtualenv env
    - source env/bin/activate
    - pip install -r requirements.txt
    - python manage.py test taskManager

integration:
  stage: integration
  script:
    - echo "This is an integration step"
    - exit 1
  allow_failure: true           # even if the job fails, continue to the next stages

prod:
  stage: prod
  script:
    - echo "This is a deploy step."
  when: manual                  # Continuous Delivery (human clicks "play")

gitleaks:
  stage: build
  variables:
    GIT_DEPTH: 0                   # full clone: gitleaks `detect` walks git history; the default shallow clone hides older commits
  script:
    - docker pull zricethezav/gitleaks
    # --source . : the course's bare `detect .` ignores the positional arg (source defaults to CWD anyway)
    # --report-format json + .json path: the course writes JSON data into a .txt / declares a .json
    #   artifact that never gets created. Format and filename must match the artifact path.
    - docker run --user $(id -u):$(id -g) -v $(pwd):/path -w /path zricethezav/gitleaks detect --source . --report-format json --report-path gitleaks-output.json
  artifacts:
    paths: [gitleaks-output.json]
    when: always
    expire_in: one week
  allow_failure: true              # exit 1 when leaks are found (change with --exit-code)
