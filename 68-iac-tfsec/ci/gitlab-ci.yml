# Minimal echo-only pipeline used for non-Django repos (webgoat, golang,
# rails, terraform, nodejs). Same stage layout as gitlab-ci-base.yml.
image: docker:20.10

services:
  - docker:dind

stages:
  - build
  - test
  - release
  - preprod
  - integration
  - prod

build:
  stage: build
  script:
    - echo "This is a build step"

test:
  stage: test
  script:
    - echo "This is a test step"

integration:
  stage: integration
  script:
    - echo "This is an integration step"
    - exit 1
  allow_failure: true

prod:
  stage: prod
  script:
    - echo "This is a deploy step."
  when: manual

tfsec:
  stage: test           # course uses a separate "validate" stage; add it to stages: if you prefer that
  script:
    - docker run --rm -v $(pwd):/src aquasec/tfsec /src -f json | tee tfsec-output.json
  artifacts:
    paths: [tfsec-output.json]
    when: always
  allow_failure: true
