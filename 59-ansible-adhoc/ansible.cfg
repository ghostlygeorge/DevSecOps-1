# Copy to /etc/ansible/ansible.cfg, OR keep as ./ansible.cfg next to your playbooks
# (precedence: $ANSIBLE_CONFIG > ./ansible.cfg > ~/.ansible.cfg > /etc/ansible/ansible.cfg)
[defaults]
stdout_callback = yaml
deprecation_warnings = False
host_key_checking = False          # lab convenience; pin known_hosts in production
retry_files_enabled = False
inventory = /inventory.ini
